# 自动构建 + 部署：push 到 main 即跑与本地一致的质量门禁（lint + tsc +
# build，`pnpm run ci`），全绿后用锁在 devDependencies 的 wrangler 部署
# dist/ 到 Cloudflare Workers。也可在 Actions 页手动触发（workflow_dispatch）。
#
# 仓库 Secrets 需要配两个（Settings → Secrets and variables → Actions）：
# - CLOUDFLARE_API_TOKEN：Cloudflare「My Profile → API Tokens」用
#   "Edit Cloudflare Workers" 模板创建（dist 是纯静态资产，无需 DNS 权限）
# - CLOUDFLARE_ACCOUNT_ID：Dashboard「Workers & Pages」右栏 Account ID
#   （wrangler.jsonc 未写 account_id，CI 里必须显式给）
#
# 加密博文/旅行（frontmatter `secret: <name>`）的口令走 BLOG_SECRET_<NAME>
# 环境变量，构建 fail-closed：CI 里没有本地随机生成的豁免（那只属于测试名
# demo），缺配置直接失败。本 workflow 仅手动触发——生产构建跑在 Cloudflare
# Workers Builds（push 自动），口令在 Dashboard → Build → Variables and
# Secrets 固定（Secret 类型即注入构建 env）。手动 dispatch 时在此配 GitHub
# Secrets 即被 build 步骤自动透传（未配置的 Secret 展开为空、语义同缺配置），
# 否则构建会按设计直接失败（绝不降级明文）。

name: Deploy

on:
  workflow_dispatch:

# 同一分支只保留一次部署，新提交顶掉在跑的旧部署
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm 版本读 package.json 的 packageManager（pnpm@12.6.0）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # lint + tsc + build（构建含全部路由预渲染；缺锁定文口令时按 fail-closed 失败）
      - name: Build (lint + tsc + prerender)
        run: pnpm run ci
        env:
          # 锁定文口令：Secrets 配好即生效；未配置的展开为空 → 构建按 fail-closed 失败
          BLOG_SECRET_DEMO: ${{ secrets.BLOG_SECRET_DEMO }}

      - name: Deploy to Cloudflare Workers
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
