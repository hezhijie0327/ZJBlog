# Automatic build + deploy: pushing to main runs the same quality gates as
# local (lint + tsc + build, `pnpm run ci`); once all green, wrangler (pinned
# in devDependencies) deploys dist/ to Cloudflare Workers. Can also be
# triggered manually from the Actions page (workflow_dispatch).
#
# Two repo Secrets are required (Settings → Secrets and variables → Actions):
# - CLOUDFLARE_API_TOKEN: create it in Cloudflare "My Profile → API Tokens"
#   with the "Edit Cloudflare Workers" template (dist is pure static assets,
#   no DNS permission needed)
# - CLOUDFLARE_ACCOUNT_ID: the Account ID in the right column of Dashboard
#   "Workers & Pages" (wrangler.jsonc does not set account_id; CI must pass
#   it explicitly)
#
# Passwords for locked posts/travels (frontmatter `secret: <name>`) go through
# the BLOG_SECRET_<NAME> env vars, and the build is fail-closed: CI has no
# local random-generation exemption (that belongs to the test name demo only);
# missing configuration fails outright. This workflow is manually triggered
# only — production builds run on Cloudflare Workers Builds (automatic on
# push), where passwords are pinned in Dashboard → Build → Variables and
# Secrets (Secret type = injected into the build env). For a manual dispatch,
# configure the GitHub Secrets here and the build step passes them through
# automatically (unconfigured Secrets expand to empty, semantically the same
# as missing configuration); otherwise the build fails by design (never falls
# back to plaintext).

name: Deploy

on:
  workflow_dispatch:

# Keep at most one deploy per branch; a new commit cancels the in-flight one
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm version read from package.json's packageManager (pnpm@12.6.0)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # lint + tsc + build (the build includes prerendering all routes; missing
      # locked-post passwords fail fail-closed)
      - name: Build (lint + tsc + prerender)
        run: pnpm run ci
        env:
          # Locked-post passwords: configured Secrets take effect; unconfigured
          # ones expand to empty → the build fails fail-closed
          BLOG_SECRET_DEMO: ${{ secrets.BLOG_SECRET_DEMO }}

      - name: Deploy to Cloudflare Workers
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
