name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: Lint, build & Lighthouse gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (static export)
        run: npm run build

      - name: Lighthouse gate (every page, all categories = 100)
        run: npm run audit
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-archive
          path: .lighthouse-archive/
          retention-days: 14
