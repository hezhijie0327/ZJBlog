<!doctype html>
<!-- OG 分享卡模板（1200×630）：修改后用 Edge/Chrome headless 截图重新生成
     public/og-default.png：
     msedge --headless=new --window-size=1200,630 --screenshot=public/og-default.png "file://.../scripts/og-template.html" -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #faf9f6;
        color: #1f1c17;
        font-family: "Source Han Serif SC", "Noto Serif SC", "SimSun", serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        box-sizing: border-box;
        position: relative;
      }
      .kicker {
        display: flex; align-items: center; gap: 14px;
        font-family: "SF Mono", Consolas, monospace;
        font-size: 22px; letter-spacing: 0.28em; color: #8a8375;
      }
      .kicker::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #e3a82b; }
      h1 { font-size: 108px; font-weight: 900; letter-spacing: -0.02em; margin-top: 34px; }
      .motto {
        margin-top: 30px; padding-left: 22px; border-left: 5px solid #e3a82b;
        font-style: italic; font-size: 34px; color: #5c564a;
      }
      .site { position: absolute; right: 96px; bottom: 72px; font-family: Consolas, monospace; font-size: 26px; color: #8a8375; }
      .brand { position: absolute; left: 96px; bottom: 72px; font-family: Consolas, monospace; font-size: 22px; letter-spacing: 0.2em; color: #b3ac9d; }
    </style>
  </head>
  <body>
    <div class="kicker">技术 · 开源 · 生活</div>
    <h1>治杰 Online</h1>
    <p class="motto">求知若渴，虚心若愚。</p>
    <span class="brand">ZHIJIE HE</span>
    <span class="site">hezhijie0327.github.io</span>
  </body>
</html>
