<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" >
  <!--
    ZJBlog brand mark: the letter "Z" plus the brand full stop.
    Gold gradient coloring (#f5c84c → #e09f0a), transparent
    background with round-cap strokes; works directly on both
    light and dark backgrounds.
  -->
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5c84c"/>
      <stop offset="1" stop-color="#e09f0a"/>
    </linearGradient>
  </defs>
  <path d="M24 27 H76 L24 73 H76" fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round" stroke-width="14" />
  <circle cx="85" cy="85" fill="url(#g)" r="7" />
</svg>
