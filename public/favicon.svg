<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" >
  <!--
    ZJBlog 品牌标：「Z」字母标 + 品牌句号
    配色沿用 ZJSearch 的金渐变（#f5c84c → #e09f0a），
    透明底 + 圆头描边，明暗背景均可直接使用
  -->
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5c84c"/>
      <stop offset="1" stop-color="#e09f0a"/>
    </linearGradient>
  </defs>
  <path d="M24 27 H76 L24 73 H76" fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round" stroke-width="14" />
  <circle cx="85" cy="85" fill="url(#g)" r="7" />
</svg>
